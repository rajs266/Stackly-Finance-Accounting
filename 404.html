<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found. Stackly Finance & Accounting." />
  <meta name="theme-color" content="#1A6B4A" />
  <title>Page Not Found — Stackly Finance & Accounting</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--clr-primary-pale) 0%, var(--clr-bg) 100%);
      position: relative;
      overflow: hidden;
    }
    .error-bg {
      position: absolute;
      inset: -10%;
      background: url('assets/bg_1.webp') center/cover no-repeat;
      opacity: 0.12;
      z-index: 0;
      animation: bg-pan 25s infinite alternate linear;
    }
    @keyframes bg-pan {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.08) translate(-2%, -2%); }
    }
    .error-page-wrapper::before,
    .error-page-wrapper::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
    }
    .error-page-wrapper::before {
      width: 400px;
      height: 400px;
      background: rgba(26, 107, 74, 0.15);
      top: -100px;
      left: -100px;
      animation: float-slow 10s ease-in-out infinite alternate;
    }
    .error-page-wrapper::after {
      width: 300px;
      height: 300px;
      background: rgba(212, 146, 10, 0.15);
      bottom: -50px;
      right: -50px;
      animation: float-slow 12s ease-in-out infinite alternate-reverse;
    }
    .error-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    .error-num {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 900;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 4px var(--clr-primary);
      margin-bottom: 1rem;
      position: relative;
      animation: float-404 6s ease-in-out infinite;
      text-shadow: 0 15px 35px rgba(26, 107, 74, 0.2);
    }
    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      color: var(--clr-text-dark);
      margin-bottom: 1rem;
      animation: slide-up 0.6s var(--ease) 0.2s both;
    }
    .error-text {
      font-size: 1.1rem;
      color: var(--clr-text-muted);
      margin-bottom: 2.5rem;
      animation: slide-up 0.6s var(--ease) 0.3s both;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      animation: slide-up 0.6s var(--ease) 0.4s both;
    }
    @keyframes float-404 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    @media (max-width: 480px) {
      .error-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="error-page-wrapper">
    <div class="error-bg"></div>
    <div class="error-content">
      <div class="error-num">404</div>
      <h1 class="error-title">Oops! Page Not Found</h1>
      <p class="error-text">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <div class="error-actions">
        <button onclick="history.back()" class="btn btn--outline btn--lg">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
        <a href="index.html" class="btn btn--primary btn--lg">
          <i class="fa-solid fa-house"></i> Back to Home
        </a>
      </div>
    </div>
  </div>

</body>
</html>
